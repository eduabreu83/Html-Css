<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex box</title>
</head>
<style>
    div.conteiner{
        background-color: antiquewhite;
        display: flex;
        flex-flow: row nowrap;
        align-items: self-start;
        height: 400px;
    }

    div.item{
        background-color: rgb(146, 127, 255);
        border: 1px solid white;
        text-align: center;
        padding: 20px;

    }
    div#i1{
       
    }
    div#i2{
        align-self: auto;
    }
    div#i3{
        align-self: flex-end;
    }
    div#i4{
        align-self: center;
    }
    div#i5{
        
    }
    div#i6{
        
    }
    div#i7{
        align-self: stretch;
    }


</style>
<body>
    <div class="conteiner">
        <div class="item" id="i1">A</div>
        <div class="item" id="i2">B</div>
        <div class="item" id="i3">C</div>
        <div class="item" id="i4">D</div>
        <div class="item" id="i5">E</div>
        <div class="item" id="i6">F</div>
        <div class="item" id="i7">G</div>
    </div>
</body>
</html>
