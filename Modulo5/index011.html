<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex box</title>
</head>
<style>
    div.conteiner{
        background-color: antiquewhite;
        display: flex;
        flex-flow: row nowrap;
    }

    div.item{
        background-color: rgb(146, 127, 255);
        border: 1px solid rgb(10, 10, 10);
        text-align: center;
        flex-basis: 200px;
    }

    div#cxA{
        flex-shrink: 0;
        flex-grow: 1;
    }
    
    div#cxB{
        flex-shrink: 1;
        flex-grow: 1;
    }


    div#cxC{
        flex-shrink: 1;
        flex-grow: 1;
    }

</style>
<body>
    <div class="conteiner">
        <div class="item" id="cxA">A</div>
        <div class="item" id="cxB">B </div>
        <div class="item" id="cxC">C</div>
    </div>
</body>
</html>
