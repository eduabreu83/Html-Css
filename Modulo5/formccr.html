<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Obrigação Contratual</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        form {
            background: #fff;
            padding: 50px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 500px;
        }
        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }
        select, input[type="text"], input[type="file"], button {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        select[multiple] {
            height: 80px;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            margin-top: 15px;
        }
        button:hover {
            background-color: #0056b3;
        }
        input[type="checkbox"] {
            margin-top: 10px;
        }

        table{
            margin-top: 30px;
            width: 500px;
            border: 1px solid black;
            border-collapse: collapse;
        }

        tr,th{
            border: 1px solid black;
            padding: 5px;
            text-align: center;
        }
        
        tbody{
            padding: 5px;
            text-align: center;
            border-collapse: collapse;
        }


    </style>
</head>
<body>
    <form id="cadastroObrigacao">
        <label for="siglaCodigo">Sigla Código da Obrigação:</label>
        <select id="siglaCodigo" name="siglaCodigo">
            <option value="">Selecione...</option>
            <option value="OC-001-2025">OC-001-2025</option>
        </select>

        <label for="descricao">Descrição da Obrigação:</label>
        <input type="text" id="descricao" name="descricao" enable>

        <label for="plataforma">Plataforma:</label>
        <select id="plataforma" name="plataforma" multiple>
            <option value="rodovias">Rodovias</option>
            <option value="mobilidade">Mobilidade</option>
            <option value="aeroporto">Aeroporto</option>
        </select>

        <label for="unidade">Unidade:</label>
        <select id="unidade" name="unidade" multiple>
            <option value="autoban">Autoban</option>
            <option value="msvias">MSVias</option>
            <option value="renovias">Renovias</option>
            <option value="rodoanel">Rodoanel</option>
        </select>

        <label for="orgao">Órgão Concedente:</label>
        <select id="orgao" name="orgao">
            <option value="artesp">Artesp</option>
        </select>

        <label for="departamento">Departamento do Órgão Concedente:</label>
        <select id="departamento" name="departamento">
            <option value="dir">Diretoria operacional</option>
        </select>

        <label for="formaEnvio">Forma de Envio:</label>
        <select id="formaEnvio" name="formaEnvio">
            <option value="email">Email</option>
        </select>

        <label for="origem">Origem da Obrigação:</label>
        <select id="origem" name="origem">
            <option value="site">Site</option>
            <option value="oficio">Ofício</option>
            <option value="portaria">Portaria</option>
            <option value="normativo">Normativo</option>
            <option value="contrato">Contrato</option>
            <option value="circular">Circular</option>
        </select>

        <label for="areaResponsavel">Área Responsável:</label>
        <select id="areaResponsavel" name="areaResponsavel" multiple>
            <option value="eng">Engenharia</option>
            <option value="jur">Juridico</option>
        </select>

        <label for="anexo">Anexo:</label>
        <input type="file" id="anexo" name="anexo">

        <label for="status">Status do Cadastro:</label>
        <input type="checkbox" id="status" name="status"> Ativo

        <button type="button" onclick="adicionarRegistro()">Cadastrar</button>

        <table id="tabelaResultados">
            <thead>
                <tr>
                    <th>Sigla Código</th>
                    <th>Unidade</th>
                    <th>Origem</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
 
    </form>
  

    <script>
        function adicionarRegistro() {
            const siglaCodigo = document.getElementById('siglaCodigo').value;
            const unidades = Array.from(document.getElementById('unidade').selectedOptions).map(option => option.value);
            const origem = document.getElementById('origem').value;
            const status = document.getElementById('status').checked ? 'Ativo' : 'Inativo';
            
            const tbody = document.getElementById('tabelaResultados').querySelector('tbody');
            unidades.forEach(unidade => {
                const row = tbody.insertRow();
                row.insertCell(0).textContent = siglaCodigo;
                row.insertCell(1).textContent = unidade;
                row.insertCell(2).textContent = origem;
                row.insertCell(3).textContent = status;
            });
        }
    </script>
</body>
</html>
