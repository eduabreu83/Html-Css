<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex box</title>
</head>
<style>
    div.conteiner{
        background-color: antiquewhite;
        display:flex ;
        /*
        Esse é o padrão mas usualemnte é utilizado o de baixo o flex-flow
        flex-direction:row;
        flex-wrap: wrap;
        */
        flex-flow: row wrap;
        
        
    }

    div.item{
        background-color: rgb(146, 127, 255);
        border: 1px solid white;
        text-align: center;
        padding: 10px;
        flex: auto;
        
        
    }

</style>
<body>
    <div class="conteiner">
        <div class="item">Exemplo de Boloco A</div>
        <div class="item">Exemplo de Boloco B</div>
        <div class="item">Exemplo de Boloco C</div>
        <div class="item">Exemplo de Boloco D</div>
        <div class="item">Exemplo de Boloco E</div>
        <div class="item">Exemplo de Boloco F</div>
        <div class="item">Exemplo de Boloco G</div>
    </div>
</body>
</html>
