<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox - centralização</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        body{
            background-color: rgb(17, 57, 97);
        }
        main{
            background-color: rgb(201, 45, 45);
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-flow: row nowrap;
            justify-content: center;
            align-items: center;   
           
        }
        section{
            background-color: rgb(30, 71, 124);
            height: 200px;
            width: 200px;
            
        }
        section > h1{
            text-align: center;
            color: white;
            font-size: 20px;
            font-family: 'Courier New', Courier, monospace;
        }

    </style>
</head>
<body>
    <main>
        <section>
            <h1>Tela de Login</h1>
        </section>
    </main>
    
</body>
</html>
