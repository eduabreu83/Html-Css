<!DOCTYPE html>
<html lang="Pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de iframe</title>
    <style>
        iframe{
            width: 400px;
            height: 400px;
        }
    </style>
</head>
<body>
    <h1>Testando o uso de um iframe</h1>
    <p>Acessando o site do <a href="https://www.cursoemvideo.com/" target="_blank"> Cursoemvideo</a>  para aprender a programar </p>
    <p>
        Acessando o site do 
        <!-- tamanho padrao 300x150-->
        <iframe src="https://www.cursoemvideo.com/" frameborder="0" height="500 width 500" scrolling="yes">
            <a href="https://www.cursoemvideo.com/" target="_blank"> Cursoemvideo</a>
        </iframe>
        para aprender a programar
    </p>
    <p>
        Acessando o site do 
        <iframe src="https://www.google.com/" frameborder="0">
            <a href="https://www.google.com/" target="_blank">google</a>
        </iframe>
        para aprender a programar
    </p>
    <p>
        Acessando o site do 
        <iframe src="https://www.gustavoguanabara.github.io" frameborder="0">
            <a href="https://www.gustavoguanabara.github.io" target="_blank">Github</a>
        </iframe>
        para aprender a programar
    </p>
</body>
</html>
