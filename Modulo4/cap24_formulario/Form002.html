<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form com outras caixa</title>
</head>
<body>
    <h1>teste de Formulario</h1>
    <form action="cadastro.php" method="POST" autocomplete="on">
        <p>
            <label for="iusu">Usuário:</label>
            <input type="text" name="Usuario" id="iusu" required minlength="5" maxlength="20" size="10" placeholder="Digite o nome " autocomplete="username">
        </p>
        <p>
            <label for="isen"> Senha:</label>
            <input type="password" name="Senha" id="isen" required minlength="8" size="25" placeholder="Digite a senha até 8 caracteres" autocomplete="current-password">
        </p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </form>
</body>
</html>
