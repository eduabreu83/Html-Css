<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
    <style>
        body{
            font: normal 20pt Arial;
        }
    </style>
</head>
<body>
    <script>
        var nome = window.prompt('Qual seu nome?')
        document.write(`o nome ${nome.bold()} tem: ${nome.length} letras <br/>`)
        document.write(` Seu nome em maiusculas é ${nome.toUpperCase()} <br/>`)
        var valor = window.prompt('Digite um valor:')
        document.write(`Em sua conta bancaria em 2027 terá:`)
        valor.toLocateString('pt-BR', {style:'currency', currency: 'BRL'})
         
    </script>
</body>
</html>
